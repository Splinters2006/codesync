[package]
name = "codesync"
version = "0.1.0"
edition = "2024"
default-run = "codesync"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:serde", "dep:serde_json", "dep:libc", "dep:getrandom", "dep:argon2", "dep:chacha20poly1305", "dep:zeroize"]

[[bin]]
name = "codesync-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

getrandom = { version = "0.3", optional = true }

argon2 = { version = "0.5", features = ["zeroize"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
zeroize = { version = "1", optional = true }
