name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build portable Windows executables
        run: python scripts/package_windows.py
      - name: Check packaged binaries and password helper
        run: python tests/windows_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: codesync-windows-x64
          path: |
            dist/codesync-windows-x64.zip
            dist/codesync-windows-x64.zip.sha256
          if-no-files-found: error
